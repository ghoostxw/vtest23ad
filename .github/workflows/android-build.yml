name: Сборка Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Установка JDK 21
      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Установка Android SDK (исправленная версия)
      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
          accept-android-sdk-licenses: true

      # 4. Создание gradlew если его нет
      - name: Проверка и создание gradlew
        id: gradle_check
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew отсутствует, создаю..."
            gradle wrapper --gradle-version 8.5
          else
            echo "gradlew найден, даю права на выполнение..."
          fi
          chmod +x ./gradlew || true
          
          # Выводим информацию о проекте
          echo "Проверка структуры проекта..."
          find . -name "*.gradle*" -o -name "*.kts" | head -10
          ./gradlew projects --no-daemon 2>&1 | head -50 || echo "Не удалось получить список проектов"

      # 5. Сборка APK
      - name: Сборка APK (Debug)
        run: |
          echo "Начинаем сборку..."
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Pandroid.injected.testOnly=false

      # 6. Загрузка APK (исправленный путь)
      - name: Загрузка APK-артефактов
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            */build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      # 7. Сохранение логов ТОЛЬКО при ошибке (опционально)
      - name: Сохранение логов при ошибке сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/
            .gradle/
          if-no-files-found: ignore
