name: Сборка Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      # 2. Установка JDK 21
      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Установка Android SDK через ОФИЦИАЛЬНЫЙ action
      - name: Установка Android SDK
        uses: android-actions/setup-android-sdk@v2.0.0
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest"
          accept-android-licenses: true

      # 4. Установка Android SDK Build Tools через sdkmanager (на всякий случай)
      - name: Дополнительная настройка SDK
        run: |
          # Устанавливаем дополнительные компоненты если нужно
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-34;google_apis;x86_64" || true

      # 5. Проверка установки
      - name: Проверка компонентов
        run: |
          echo "=== Проверка Android SDK ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "PATH: $PATH"
          
          echo "Установленные платформы:"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "Директория platforms не найдена"
          
          echo "Установленные build-tools:"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "Директория build-tools не найдена"
          
          # Проверяем команды
          which sdkmanager || echo "sdkmanager не найден"
          which adb || echo "adb не найден"

      # 6. Подготовка Gradle
      - name: Подготовка Gradle
        run: |
          echo "=== Подготовка Gradle ==="
          
          # Даём права на gradlew если он есть
          if [ -f "gradlew" ]; then
            echo "gradlew найден"
            chmod +x gradlew
          else
            echo "gradlew не найден, создаю минимальную структуру..."
            
            # Проверяем, есть ли Gradle файлы
            if ls *.gradle* 1> /dev/null 2>&1; then
              echo "Gradle файлы уже существуют"
            else
              # Создаём минимальную структуру
              cat > settings.gradle.kts << 'EOF'
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "AndroidApp"
              include(":app")
              EOF
            fi
            
            # Создаём gradle wrapper
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
          fi
          
          # Проверяем версию
          ./gradlew --version || echo "Не удалось проверить версию Gradle"

      # 7. Сборка APK
      - name: Сборка APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "=== Начинаем сборку ==="
          
          # Выводим список доступных задач
          echo "Доступные задачи Gradle:"
          ./gradlew tasks --all 2>&1 | grep -E "(assemble|build)" | head -20 || echo "Не удалось получить список задач"
          
          # Пробуем собрать
          echo "Запуск сборки..."
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain 2>&1 | tee build_output.log
          
          # Проверяем результат
          if [ $? -eq 0 ]; then
            echo "✅ Сборка успешно завершена!"
            
            # Ищем APK файлы
            echo "Поиск APK файлов..."
            find . -name "*.apk" -type f 2>/dev/null | while read file; do
              echo "Найден: $file"
              ls -lh "$file"
            done
            
            # Если не нашли, ищем в стандартных местах
            if ! find . -name "*.apk" -type f 2>/dev/null | grep -q .; then
              echo "APK не найдены автоматически, проверяем стандартные пути:"
              ls -la app/build/outputs/apk/ 2>/dev/null || echo "Путь app/build/outputs/apk/ не существует"
              ls -la */build/outputs/apk/ 2>/dev/null || echo "Ни один путь *\/build/outputs/apk/ не существует"
            fi
          else
            echo "❌ Сборка завершилась с ошибкой"
            echo "Последние 30 строк лога:"
            tail -30 build_output.log
            exit 1
          fi

      # 8. Загрузка APK
      - name: Загрузка артефактов
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            */build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*debug*.apk
          if-no-files-found: error

      # 9. Сохранение логов при ошибке
      - name: Сохранение логов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            **/build/reports/**
          if-no-files-found: ignore
