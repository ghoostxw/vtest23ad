name: 🚀 Сборка с исправлением Gradle

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # 1. ИСПРАВЛЯЕМ ВЕРСИЮ GRADLE
      - name: 🔧 Исправление версии Gradle
        run: |
          echo "=== ИСПРАВЛЯЕМ ВЕРСИЮ GRADLE ==="
          
          # Исправляем gradle-wrapper.properties
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Меняем версию Gradle на 7.5..."
            sed -i 's/gradle-.*-bin\.zip/gradle-7.5-bin.zip/' gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-.*-all\.zip/gradle-7.5-bin.zip/' gradle/wrapper/gradle-wrapper.properties
            echo "Обновлённый файл:"
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "Создаём gradle-wrapper.properties..."
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            EOF
          fi
          
          # Исправляем файлы если нужно
          echo ""
          echo "Проверяем app/build.gradle.kts..."
          if [ -f "app/build.gradle.kts" ]; then
            # Убираем устаревшие опции
            sed -i '/android.enableD8/d' app/build.gradle.kts
            sed -i '/android.enableJetifier/d' app/build.gradle.kts
            echo "app/build.gradle.kts очищен от устаревших опций"
          fi
      
      # 2. Установка JDK 17 (обязательно для Gradle 7.5)
      - name: ⚙️ Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 3. Установка Android SDK
      - name: 🤖 Установка Android SDK
        run: |
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      # 4. СБОРКА С ПРАВИЛЬНОЙ ВЕРСИЕЙ GRADLE
      - name: 🏗️ Сборка с Gradle 7.5
        run: |
          echo "=== ЗАПУСК СБОРКИ ==="
          
          # Обновляем wrapper
          ./gradlew wrapper --gradle-version 7.5 --distribution-type bin
          chmod +x gradlew
          
          echo "Версия Gradle:"
          ./gradlew --version 2>&1 | head -3
          
          echo ""
          echo "Сборка с совместимыми настройками..."
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all \
            --console=plain 2>&1 | tee /tmp/build.log
          
          if [ $? -eq 0 ]; then
            echo "✅ СБОРКА УСПЕШНА!"
            echo ""
            echo "APK файлы:"
            find . -name "*.apk" -type f 2>/dev/null || echo "Не найдены"
          else
            echo "❌ ОШИБКА!"
            echo "Последние 30 строк:"
            tail -30 /tmp/build.log
            exit 1
          fi
      
      # 5. Загрузка результатов
      - name: 📦 Загрузка APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
