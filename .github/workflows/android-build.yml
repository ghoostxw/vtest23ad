name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_SDK_ROOT: /home/runner/Android/Sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Go supported by GitHub Actions
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - name: Install Android commandline tools and SDK packages
        run: |
          set -e
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          if [ -d "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" ]; then
            mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          fi
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"
          yes | sdkmanager --licenses

      # gomobile pinned to a pre-Go-1.24 commit
      - name: Install gomobile
        run: |
          set -e
          go version
          go install golang.org/x/mobile/cmd/gomobile@4b6d9d1
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build native core
        run: |
          chmod +x ./scripts/build_native.sh
          ./scripts/build_native.sh

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
