name: Простейшая сборка

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 1. Исправляем файлы
        run: |
          # Просто копируем
          if [ -f "build.gradle.kts" ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi
          
          # Минимальный корневой файл
          echo 'plugins { id("com.android.application") version "8.5.0" apply false }' > build.gradle.kts
          
          # Минимальный settings
          echo 'pluginManagement { repositories { google(); mavenCentral() } }' > settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
      
      - name: 2. Устанавливаем Java
        run: sudo apt install -y openjdk-17-jdk
      
      - name: 3. Собираем
        run: |
          # Принудительно ставим Gradle 7.5
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          
          # Пробуем собрать
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -50
