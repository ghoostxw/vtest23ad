name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонирование
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Установка JDK
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Установка Android SDK (упрощенная)
      - name: Setup Android
        run: |
          # Создаем директорию
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          
          # Скачиваем tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          
          # Экспортируем переменные
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          
          # Лицензии и установка
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 4. Установка Go (для core/go)
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      # 5. Установка Rust (для rust/)
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true
          
      # 6. Установка CMake и NDK
      - name: Setup NDK and CMake
        run: |
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;25.2.9519653"
          
      # 7. Сборка нативных компонентов ПЕРЕД Android
      - name: Build Native Components
        run: |
          echo "=== Building Go components ==="
          cd core/go
          go mod download 2>&1 | tail -20
          
          echo "=== Building Rust components ==="
          cd ../../rust
          cargo build --target aarch64-linux-android --release 2>&1 | tail -20 || echo "Rust build might fail, continuing..."
          
      # 8. Даем права gradlew
      - name: Prepare Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            # Создаем gradlew если его нет (хотя должен быть)
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi
          
      # 9. Сборка Android (ТОЛЬКО КОТЛИН ЧАСТЬ)
      - name: Build Android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          echo "=== Building Android APK ==="
          
          # Сначала очистка
          ./gradlew clean
          
          # Пробуем собрать только Kotlin часть, без нативных компонентов
          ./gradlew :app:assembleDebug \
            -PskipNativeBuild=true \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee build.log
          
          # Если не сработало, пробуем без флагов
          if [ $? -ne 0 ]; then
            echo "First attempt failed, trying without skipNativeBuild..."
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace 2>&1 | tail -100
          fi

      # 10. Загрузка результатов
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*debug*.apk
          if-no-files-found: warn

      # 11. Логи при ошибке
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            **/build/reports/**
          if-no-files-found: ignore
