name: 🚀 Сборка Android APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # 1. ПРОСТОЕ СОЗДАНИЕ ПРАВИЛЬНОЙ СТРУКТУРЫ
      - name: 🛠️ Создаем правильные файлы
        run: |
          echo "=== СОЗДАЕМ ПРАВИЛЬНЫЕ ФАЙЛЫ ==="
          
          # 1. Сохраняем старый файл если он содержит Android конфиг
          if grep -q "android {" build.gradle.kts 2>/dev/null; then
            echo "Сохраняю старый build.gradle.kts..."
            cp build.gradle.kts /tmp/old_build.gradle.kts
          fi
          
          # 2. КОРНЕВОЙ build.gradle.kts - ТОЛЬКО ПЛАГИНЫ
          echo 'plugins {' > build.gradle.kts
          echo '    id("com.android.application") version "8.5.0" apply false' >> build.gradle.kts
          echo '    id("org.jetbrains.kotlin.android") version "1.9.20" apply false' >> build.gradle.kts
          echo '}' >> build.gradle.kts
          
          # 3. APP build.gradle.kts - используем старый или создаем минимальный
          if [ -f "/tmp/old_build.gradle.kts" ]; then
            echo "Использую старый Android конфиг для app/"
            cp /tmp/old_build.gradle.kts app/build.gradle.kts
          elif [ -f "app/build.gradle.kts" ] && [ -s "app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts уже существует"
          else
            echo "Создаю минимальный app/build.gradle.kts..."
            # Создаем простой файл без heredoc
            echo 'plugins {' > app/build.gradle.kts
            echo '    id("com.android.application")' >> app/build.gradle.kts
            echo '    id("org.jetbrains.kotlin.android")' >> app/build.gradle.kts
            echo '}' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo 'android {' >> app/build.gradle.kts
            echo '    namespace = "com.example.v2rayadguard"' >> app/build.gradle.kts
            echo '    compileSdk = 34' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo '    defaultConfig {' >> app/build.gradle.kts
            echo '        applicationId = "com.example.v2rayadguard"' >> app/build.gradle.kts
            echo '        minSdk = 24' >> app/build.gradle.kts
            echo '        targetSdk = 34' >> app/build.gradle.kts
            echo '        versionCode = 1' >> app/build.gradle.kts
            echo '        versionName = "1.0"' >> app/build.gradle.kts
            echo '    }' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo '    buildTypes {' >> app/build.gradle.kts
            echo '        getByName("debug") {' >> app/build.gradle.kts
            echo '            isMinifyEnabled = false' >> app/build.gradle.kts
            echo '        }' >> app/build.gradle.kts
            echo '    }' >> app/build.gradle.kts
            echo '}' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo 'dependencies {' >> app/build.gradle.kts
            echo '    implementation("androidx.core:core-ktx:1.12.0")' >> app/build.gradle.kts
            echo '    implementation("androidx.appcompat:appcompat:1.6.1")' >> app/build.gradle.kts
            echo '}' >> app/build.gradle.kts
          fi
          
          # 4. SETTINGS.GRADLE.KTS - ВСЕ репозитории ЗДЕСЬ
          echo 'pluginManagement {' > settings.gradle.kts
          echo '    repositories {' >> settings.gradle.kts
          echo '        google()' >> settings.gradle.kts
          echo '        mavenCentral()' >> settings.gradle.kts
          echo '        gradlePluginPortal()' >> settings.gradle.kts
          echo '    }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo '' >> settings.gradle.kts
          echo 'dependencyResolutionManagement {' >> settings.gradle.kts
          echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle.kts
          echo '    repositories {' >> settings.gradle.kts
          echo '        google()' >> settings.gradle.kts
          echo '        mavenCentral()' >> settings.gradle.kts
          echo '    }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo '' >> settings.gradle.kts
          echo 'rootProject.name = "V2rayAdGuard"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
          # Временно закомментируем проблемные модули
          echo '// include(":core")' >> settings.gradle.kts
          echo '// include(":dns:kotlin")' >> settings.gradle.kts
          
          echo "✅ Файлы созданы"
          echo ""
          echo "Корневой build.gradle.kts (должен быть маленький):"
          wc -l build.gradle.kts
          echo ""
          echo "app/build.gradle.kts (должен содержать android блок):"
          grep -c "android {" app/build.gradle.kts || echo "Нет android блока"
      
      # 2. Установка Java
      - name: ☕ Установка Java 17
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk
          echo "JAVA_HOME=$(readlink -f /usr/bin/java | sed 's:bin/java::')" >> $GITHUB_ENV
      
      # 3. СБОРКА
      - name: 🏗️ Сборка APK
        run: |
          echo "=== ЗАПУСК СБОРКИ ==="
          
          # Обновляем Gradle wrapper до 8.5
          ./gradlew wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew
          
          echo "Версия Gradle:"
          ./gradlew --version 2>&1 | head -5
          
          echo ""
          echo "Проверка проектов:"
          ./gradlew projects --no-daemon 2>&1 | grep -A5 "Root project"
          
          echo ""
          echo "Запуск сборки..."
          if ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=none 2>&1 | tee /tmp/build_output.log; then
            echo "✅ СБОРКА УСПЕШНА!"
            
            echo ""
            echo "Результаты:"
            APKS=$(find . -name "*.apk" -type f 2>/dev/null)
            if [ -n "$APKS" ]; then
              echo "Найдены APK:"
              echo "$APKS"
              for apk in $APKS; do
                echo "  📦 $apk ($(ls -lh "$apk" | awk '{print $5}'))"
              done
            else
              echo "APK не найдены. Проверяем:"
              ls -la app/build/outputs/apk/ 2>/dev/null || echo "Нет outputs/apk"
            fi
          else
            echo "❌ ОШИБКА СБОРКИ"
            echo ""
            echo "Последние 20 строк ошибки:"
            tail -20 /tmp/build_output.log
            exit 1
          fi
      
      # 4. Загрузка
      - name: 📦 Загрузка APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
