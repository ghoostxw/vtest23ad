name: 🔍 Диагностика проекта

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: 📋 Показать структуру проекта
        run: |
          echo "=========================================="
          echo "📁 ПОЛНАЯ СТРУКТУРА ПРОЕКТА"
          echo "=========================================="
          find . -type f -name "*.gradle*" -o -name "*.kts" -o -name "*.properties" | sort
          
          echo ""
          echo "=========================================="
          echo "⚙️  НАСТРОЙКИ GRADLE (settings.gradle.kts)"
          echo "=========================================="
          if [ -f "settings.gradle.kts" ]; then
            cat settings.gradle.kts
          else
            echo "❌ Файл не найден!"
          fi
          
          echo ""
          echo "=========================================="
          echo "🏗️  КОРНЕВОЙ BUILD.GRADLE.KTS"
          echo "=========================================="
          if [ -f "build.gradle.kts" ]; then
            cat build.gradle.kts
          else
            echo "❌ Файл не найден!"
          fi
          
          echo ""
          echo "=========================================="
          echo "📱 APP/BUILD.GRADLE.KTS (первые 150 строк)"
          echo "=========================================="
          if [ -f "app/build.gradle.kts" ]; then
            head -150 app/build.gradle.kts
          else
            echo "❌ Файл не найден!"
            echo "Содержимое папки app/:"
            ls -la app/ 2>/dev/null || echo "Папки app нет!"
          fi
          
          echo ""
          echo "=========================================="
          echo "📊 GRADLE PROPERTIES"
          echo "=========================================="
          if [ -f "gradle.properties" ]; then
            cat gradle.properties
          else
            echo "Нет файла gradle.properties"
          fi
          
          echo ""
          echo "=========================================="
          echo "🔧 GRADLE WRAPPER"
          echo "=========================================="
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "Нет Gradle wrapper"
          fi
          
          echo ""
          echo "=========================================="
          echo "📦 ЗАВИСИМОСТИ В ПРОЕКТЕ"
          echo "=========================================="
          echo "1. Plugins в app/build.gradle.kts:"
          grep -A5 -B5 "plugins {" app/build.gradle.kts 2>/dev/null || echo "Не найден"
          
          echo ""
          echo "2. Android блок:"
          grep -A20 "android {" app/build.gradle.kts 2>/dev/null | head -30 || echo "Не найден"
          
          echo ""
          echo "3. Dependencies:"
          grep -A50 "dependencies {" app/build.gradle.kts 2>/dev/null | head -60 || echo "Не найден"

      - name: 🧪 Проверка Gradle
        run: |
          echo "=========================================="
          echo "🧪 ПРОВЕРКА GRADLE"
          echo "=========================================="
          
          # Создаем gradlew если нет
          if [ ! -f "gradlew" ]; then
            echo "Создаю gradlew..."
            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              GRADLE_VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.*/\1/')
              echo "Версия из wrapper: $GRADLE_VERSION"
              gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
            else
              gradle wrapper --gradle-version 8.5 --distribution-type bin
            fi
            chmod +x gradlew
          else
            chmod +x gradlew
          fi
          
          echo "Проверяем версию Gradle..."
          ./gradlew --version || echo "❌ Gradle не запускается"
          
          echo ""
          echo "Список проектов:"
          ./gradlew projects --no-daemon 2>&1 | tail -50 || echo "❌ Не удалось получить список проектов"

      - name: 🚀 Попытка сборки
        run: |
          echo "=========================================="
          echo "🚀 ПРОБУЕМ СОБРАТЬ"
          echo "=========================================="
          
          # Пробуем разные варианты
          echo "1. Просто tasks:"
          ./gradlew tasks --all 2>&1 | grep -i "assemble\|build" | head -20 || echo "Нет assemble задач"
          
          echo ""
          echo "2. Пробуем собрать:"
          set +e  # Не выходить при ошибке
          
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee /tmp/build_output.txt
          
          BUILD_RESULT=$?
          
          echo ""
          echo "=========================================="
          echo "📊 РЕЗУЛЬТАТ СБОРКИ"
          echo "=========================================="
          
          if [ $BUILD_RESULT -eq 0 ]; then
            echo "✅ СБОРКА УСПЕШНА!"
            echo ""
            echo "Найденные APK файлы:"
            find . -name "*.apk" -type f 2>/dev/null
          else
            echo "❌ СБОРКА ПРОВАЛИЛАСЬ"
            echo ""
            echo "ПОСЛЕДНИЕ 50 СТРОК ОШИБКИ:"
            tail -50 /tmp/build_output.txt
            
            echo ""
            echo "ГДЕ ИМЕННО ОШИБКА:"
            grep -n -B5 -A5 "error:" /tmp/build_output.txt | tail -30 || grep -n -B5 -A5 "FAILED" /tmp/build_output.txt | tail -30
            
            echo ""
            echo "ПОЛНЫЙ ЛОГ СОХРАНЕН В /tmp/build_output.txt"
          fi

      - name: 💾 Сохранить логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-logs
          path: |
            /tmp/build_output.txt
          if-no-files-found: warn
