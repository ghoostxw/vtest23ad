name: ✅ Рабочая сборка Android

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # 1. СОЗДАЕМ ПРАВИЛЬНУЮ СТРУКТУРУ
      - name: 🛠️ Создаем правильные файлы
        run: |
          echo "=== СОЗДАЕМ ПРАВИЛЬНЫЕ ФАЙЛЫ ==="
          
          # 1. Корневой build.gradle.kts (ТОЛЬКО плагины)
          echo 'buildscript {' > build.gradle.kts
          echo '    repositories {' >> build.gradle.kts
          echo '        google()' >> build.gradle.kts
          echo '        mavenCentral()' >> build.gradle.kts
          echo '    }' >> build.gradle.kts
          echo '    dependencies {' >> build.gradle.kts
          echo '        classpath("com.android.tools.build:gradle:8.5.0")' >> build.gradle.kts
          echo '        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20")' >> build.gradle.kts
          echo '    }' >> build.gradle.kts
          echo '}' >> build.gradle.kts
          echo '' >> build.gradle.kts
          echo 'allprojects {' >> build.gradle.kts
          echo '    repositories {' >> build.gradle.kts
          echo '        google()' >> build.gradle.kts
          echo '        mavenCentral()' >> build.gradle.kts
          echo '    }' >> build.gradle.kts
          echo '}' >> build.gradle.kts
          
          # 2. app/build.gradle.kts (берем из корня если есть)
          if [ -f "build.gradle.kts.backup" ]; then
            cp build.gradle.kts.backup app/build.gradle.kts
          elif grep -q "android {" build.gradle.kts 2>/dev/null; then
            # Сохраняем старый файл
            cp build.gradle.kts build.gradle.kts.backup
            # Копируем в app
            cp build.gradle.kts app/build.gradle.kts
            echo "Скопировал Android конфиг в app/"
          else
            # Создаем минимальный
            echo 'plugins {' > app/build.gradle.kts
            echo '    id("com.android.application")' >> app/build.gradle.kts
            echo '    id("org.jetbrains.kotlin.android")' >> app/build.gradle.kts
            echo '}' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo 'android {' >> app/build.gradle.kts
            echo '    namespace = "com.example.app"' >> app/build.gradle.kts
            echo '    compileSdk = 34' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo '    defaultConfig {' >> app/build.gradle.kts
            echo '        applicationId = "com.example.app"' >> app/build.gradle.kts
            echo '        minSdk = 24' >> app/build.gradle.kts
            echo '        targetSdk = 34' >> app/build.gradle.kts
            echo '        versionCode = 1' >> app/build.gradle.kts
            echo '        versionName = "1.0"' >> app/build.gradle.kts
            echo '    }' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo '    buildTypes {' >> app/build.gradle.kts
            echo '        getByName("debug") {' >> app/build.gradle.kts
            echo '            isMinifyEnabled = false' >> app/build.gradle.kts
            echo '        }' >> app/build.gradle.kts
            echo '    }' >> app/build.gradle.kts
            echo '}' >> app/build.gradle.kts
            echo '' >> app/build.gradle.kts
            echo 'dependencies {' >> app/build.gradle.kts
            echo '    implementation("androidx.core:core-ktx:1.12.0")' >> app/build.gradle.kts
            echo '}' >> app/build.gradle.kts
          fi
          
          # 3. settings.gradle.kts (ОБЯЗАТЕЛЬНО с pluginManagement)
          echo 'pluginManagement {' > settings.gradle.kts
          echo '    repositories {' >> settings.gradle.kts
          echo '        google()' >> settings.gradle.kts
          echo '        mavenCentral()' >> settings.gradle.kts
          echo '        gradlePluginPortal()' >> settings.gradle.kts
          echo '    }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo '' >> settings.gradle.kts
          echo 'dependencyResolutionManagement {' >> settings.gradle.kts
          echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle.kts
          echo '    repositories {' >> settings.gradle.kts
          echo '        google()' >> settings.gradle.kts
          echo '        mavenCentral()' >> settings.gradle.kts
          echo '    }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo '' >> settings.gradle.kts
          echo 'rootProject.name = "V2rayAdGuard"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
          
          echo "✅ Файлы созданы"
          echo ""
          echo "Проверка settings.gradle.kts:"
          head -20 settings.gradle.kts
      
      # 2. Установка Java
      - name: ☕ Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 3. Сборка БЕЗ Android SDK (для теста)
      - name: 🧪 Тестовая сборка
        run: |
          echo "=== ТЕСТОВАЯ СБОРКА ==="
          
          # Создаем gradlew с правильной версией
          gradle wrapper --gradle-version 7.5 --distribution-type bin
          chmod +x gradlew
          
          echo "Версия Gradle:"
          ./gradlew --version 2>&1 | head -5
          
          echo ""
          echo "Проверка плагинов..."
          ./gradlew :app:buildEnvironment --no-daemon 2>&1 | grep -A5 -B5 "classpath" || echo "Не удалось проверить"
          
          echo ""
          echo "Запуск сборки..."
          # Флаг -Pandroid.injected.invoked.from.ide=true помогает с совместимостью
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Pandroid.injected.invoked.from.ide=true 2>&1 | tee /tmp/build.log
          
          if grep -q "BUILD SUCCESSFUL" /tmp/build.log; then
            echo "🎉 ✅ СБОРКА УСПЕШНА!"
            echo ""
            echo "Результаты:"
            find . -name "*.apk" -type f 2>/dev/null | head -5
          else
            echo "❌ ОШИБКА СБОРКИ"
            echo ""
            echo "Ключевая ошибка:"
            grep -i -B3 -A3 "error\|failed\|exception\|not found" /tmp/build.log | tail -30
            echo ""
            echo "Полный лог сохранен"
          fi
      
      # 4. Загрузка результатов
      - name: 📦 Загрузка артефактов
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: ignore
