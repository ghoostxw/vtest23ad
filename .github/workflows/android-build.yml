name: Минимальная сборка

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Быстрое исправление
        run: |
          # 1. Копируем корневой файл в app
          if [ -f "build.gradle.kts" ] && [ ! -s "app/build.gradle.kts" ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi
          
          # 2. Создаём минимальный корневой файл
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF
          
          # 3. Минимальный settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "App"
          include(":app")
          EOF
      
      - name: Сборка
        run: |
          # Устанавливаем только JDK
          sudo apt update
          sudo apt install -y openjdk-17-jdk
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -100
          else
            echo "gradlew не найден"
          fi
