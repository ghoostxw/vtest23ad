name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java: [ '21' ]
        android-build-tools: [ '34.0.0' ]
        android-platform: [ 'android-34' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;${{ matrix.android-platform }}
            build-tools;${{ matrix.android-build-tools }}
            cmdline-tools;latest
          ndk-version: '26.1.10909125'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: core/go/go.sum

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      - name: Install Android NDK for Rust
        run: |
          echo "Installing Android NDK..."
          $ANDROID_HOME/ndk/26.1.10909125/build/tools/make_standalone_toolchain.py \
            --arch arm64 \
            --api 24 \
            --install-dir /tmp/android-toolchain

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate gradlew if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build native components (Go)
        working-directory: ./core/go
        run: |
          echo "Building Go components..."
          go mod download
          # Добавьте здесь команды сборки Go, если они есть в README.md

      - name: Build native components (Rust)
        working-directory: ./rust
        run: |
          echo "Building Rust components..."
          # Настройка переменных окружения для кросс-компиляции
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="/tmp/android-toolchain/bin/aarch64-linux-android-clang"
          cargo build --target aarch64-linux-android --release

      - name: Build with Gradle
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          echo "Building Android APK..."
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
