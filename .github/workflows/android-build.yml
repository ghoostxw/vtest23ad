name: Сборка Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      # 2. Установка JDK 21
      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Установка Android SDK через ОФИЦИАЛЬНЫЙ action Google
      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        id: android-sdk-setup
        with:
          # Пакеты указываем через запятую в ОДНОЙ строке
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"
          accept-android-sdk-licenses: true

      # 4. Альтернатива: если шаг 3 не работает, используем этот
      - name: Установка Android SDK (альтернатива)
        if: steps.android-sdk-setup.outcome == 'failure'
        run: |
          echo "Устанавливаем Android SDK вручную..."
          
          # Создаём директорию для SDK
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          
          # Скачиваем Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/
          
          # Устанавливаем переменные окружения
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          
          # Принимаем лицензии
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          
          # Устанавливаем компоненты
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          echo "Проверка установки:"
          ls -la $HOME/android-sdk/platforms/

      # 5. Проверка установки SDK
      - name: Проверка Android SDK
        run: |
          echo "=== Проверка Android окружения ==="
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME: $ANDROID_HOME"
          
          # Проверяем доступные команды
          which sdkmanager || echo "sdkmanager не найден в PATH"
          which adb || echo "adb не найден"
          
          # Проверяем установленные компоненты
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-34" ]; then
            echo "✅ Android SDK Platform 34 установлен"
          else
            echo "❌ Android SDK Platform 34 не найден"
            echo "Содержимое $ANDROID_SDK_ROOT/platforms/:"
            ls -la "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || echo "Директория не существует"
          fi

      # 6. Настройка Gradle
      - name: Настройка Gradle
        run: |
          echo "=== Настройка Gradle ==="
          
          # Если gradlew существует, даём права
          if [ -f "gradlew" ]; then
            echo "gradlew найден"
            chmod +x gradlew
            ./gradlew --version || echo "Не удалось запустить gradlew"
          else
            echo "gradlew не найден, проверяем структуру проекта..."
            
            # Смотрим, есть ли Gradle файлы
            echo "Содержимое репозитория:"
            ls -la
            
            # Если есть Android проект, создаём gradlew
            if [ -d "app" ] && [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
              echo "Android проект обнаружен, создаём gradlew..."
              
              # Создаём settings.gradle.kts если его нет
              if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
                cat > settings.gradle.kts << 'EOF'
                pluginManagement {
                    repositories {
                        google()
                        mavenCentral()
                        gradlePluginPortal()
                    }
                }
                dependencyResolutionManagement {
                    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                    repositories {
                        google()
                        mavenCentral()
                    }
                }
                rootProject.name = "AndroidApp"
                include(":app")
                EOF
              fi
              
              # Создаём gradle wrapper
              gradle wrapper --gradle-version 8.5 --distribution-type bin
              chmod +x gradlew
            else
              echo "❌ Android проект не обнаружен!"
              echo "Создайте папку 'app' с файлом build.gradle.kts"
              exit 1
            fi
          fi

      # 7. Сборка APK
      - name: Сборка APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "=== Запуск сборки ==="
          
          # Сначала проверяем задачи
          echo "Проверка доступных задач Gradle..."
          ./gradlew tasks 2>&1 | grep -i "assemble" || echo "Задачи assemble не найдены"
          
          echo "Сборка APK..."
          set -x  # Включаем отладку
          
          # Пробуем собрать
          if ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --info; then
            echo "✅ Сборка успешно завершена!"
          else
            echo "❌ Ошибка сборки"
            echo "Последние 50 строк лога:"
            tail -50 build/reports/ || echo "Логи не найдены"
            exit 1
          fi
          
          set +x  # Выключаем отладку

      # 8. Поиск и загрузка APK
      - name: Поиск APK файлов
        if: success()
        run: |
          echo "=== Поиск собранных APK ==="
          
          # Ищем APK файлы
          find . -name "*.apk" -type f 2>/dev/null | while read file; do
            echo "Найден APK: $file"
            ls -lh "$file"
          done
          
          # Если не нашли, создаём тестовый APK
          if ! find . -name "*.apk" -type f 2>/dev/null | grep -q .; then
            echo "⚠️ APK файлы не найдены"
            echo "Проверяем структуру вывода сборки..."
            find . -type d -name "outputs" -o -name "apk" 2>/dev/null | head -10
          fi

      - name: Загрузка APK артефактов
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            */build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: warn
