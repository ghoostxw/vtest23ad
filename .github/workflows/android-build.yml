name: Сборка Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      # 2. Установка JDK 21
      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Установка Android SDK (ПРАВИЛЬНЫЙ формат!)
      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
            patcher;v4
          accept-android-sdk-licenses: true

      # 4. Альтернативный вариант - используем официальный action от Google
      # (РАСКОММЕНТИРУЙТЕ этот шаг, если верхний не работает)
      # - name: Установка Android SDK (альтернатива)
      #   uses: android-actions/setup-android-sdk@v2.0.0
      #   with:
      #     packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      #     accept-android-licenses: true

      # 5. Проверка установки
      - name: Проверка установленных компонентов
        run: |
          echo "Проверка Android SDK..."
          ls -la $ANDROID_HOME/ || echo "ANDROID_HOME не найден"
          
          # Проверяем конкретные компоненты
          if [ -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "✅ Android 34 установлен"
          else
            echo "❌ Android 34 не найден"
            echo "Доступные платформы:"
            ls -la $ANDROID_HOME/platforms/ 2>/dev/null || true
          fi
          
          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "✅ Build tools 34.0.0 установлены"
          else
            echo "❌ Build tools 34.0.0 не найдены"
            echo "Доступные версии build tools:"
            ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || true
          fi

      # 6. Создаём gradlew если его нет
      - name: Подготовка Gradle
        run: |
          echo "Проверка Gradle структуры..."
          
          # Проверяем существующие файлы
          if [ -f "gradlew" ]; then
            echo "gradlew найден, даю права на выполнение..."
            chmod +x gradlew
          else
            echo "gradlew не найден, создаю..."
            
            # Создаём минимальную Gradle структуру
            cat > settings.gradle.kts << 'EOF'
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "V2rayAdGuard"
            include(":app")
            EOF
            
            # Создаём корневой build.gradle.kts
            cat > build.gradle.kts << 'EOF'
            plugins {
                id("com.android.application") version "8.5.0" apply false
                id("org.jetbrains.kotlin.android") version "1.9.20" apply false
            }
            EOF
            
            # Создаём app/build.gradle.kts если его нет
            mkdir -p app
            if [ ! -f "app/build.gradle.kts" ]; then
              cat > app/build.gradle.kts << 'EOF'
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }
              
              android {
                  namespace = "com.example.v2rayadguard"
                  compileSdk = 34
                  
                  defaultConfig {
                      applicationId = "com.example.v2rayadguard"
                      minSdk = 24
                      targetSdk = 34
                      versionCode = 1
                      versionName = "1.0"
                  }
                  
                  buildTypes {
                      getByName("debug") {
                          isMinifyEnabled = false
                      }
                  }
                  
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
              
              dependencies {
                  implementation("androidx.core:core-ktx:1.12.0")
                  implementation("androidx.appcompat:appcompat:1.6.1")
                  implementation("com.google.android.material:material:1.11.0")
              }
              EOF
            fi
            
            # Создаём gradlew wrapper
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
          fi
          
          echo "Проверка версии Gradle..."
          ./gradlew --version || echo "Не удалось проверить версию Gradle"

      # 7. Сборка APK (упрощённая)
      - name: Сборка APK
        run: |
          echo "Запуск сборки..."
          ./gradlew tasks --all 2>&1 | grep -i assemble || echo "Задачи assemble не найдены"
          
          # Пробуем собрать
          if ./gradlew :app:assembleDebug --stacktrace; then
            echo "✅ Сборка успешна!"
            
            # Ищем APK файлы
            echo "Найденные APK файлы:"
            find . -name "*.apk" -type f 2>/dev/null | head -10
            
            if find . -name "*.apk" -type f 2>/dev/null | grep -q .; then
              echo "APK файлы найдены"
            else
              echo "⚠️ APK файлы не найдены, проверяем структуру вывода..."
              find . -type d -name "apk" -o -name "outputs" 2>/dev/null | head -10
            fi
          else
            echo "❌ Сборка завершилась с ошибкой"
            exit 1
          fi

      # 8. Загрузка артефактов
      - name: Загрузка APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/*.apk
            */build/outputs/apk/debug/*.apk
          if-no-files-found: warn
