name: 🚀 Исправление и сборка

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # 1. ПРОСТОЕ ИСПРАВЛЕНИЕ: меняем файлы местами
      - name: 🔧 Исправление файлов
        run: |
          echo "=== ИСПРАВЛЯЕМ ==="
          
          # Сохраняем корневой файл (он содержит Android конфиг)
          if [ -f "build.gradle.kts" ]; then
            echo "Сохраняем корневой build.gradle.kts..."
            cp build.gradle.kts /tmp/root_build_backup.kts
          fi
          
          # Перемещаем корневой файл в app/
          echo "Перемещаем Android конфиг в app/..."
          mv build.gradle.kts app/build.gradle.kts
          
          # Создаём новый корневой файл
          echo "Создаём новый корневой build.gradle.kts..."
          echo 'plugins {' > build.gradle.kts
          echo '    id("com.android.application") version "8.5.0" apply false' >> build.gradle.kts
          echo '    id("org.jetbrains.kotlin.android") version "1.9.20" apply false' >> build.gradle.kts
          echo '}' >> build.gradle.kts
          
          # Создаём settings.gradle.kts если нет
          echo "Проверяем settings.gradle.kts..."
          if [ ! -f "settings.gradle.kts" ]; then
            echo 'pluginManagement {' > settings.gradle.kts
            echo '    repositories {' >> settings.gradle.kts
            echo '        google()' >> settings.gradle.kts
            echo '        mavenCentral()' >> settings.gradle.kts
            echo '        gradlePluginPortal()' >> settings.gradle.kts
            echo '    }' >> settings.gradle.kts
            echo '}' >> settings.gradle.kts
            echo '' >> settings.gradle.kts
            echo 'dependencyResolutionManagement {' >> settings.gradle.kts
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle.kts
            echo '    repositories {' >> settings.gradle.kts
            echo '        google()' >> settings.gradle.kts
            echo '        mavenCentral()' >> settings.gradle.kts
            echo '    }' >> settings.gradle.kts
            echo '}' >> settings.gradle.kts
            echo '' >> settings.gradle.kts
            echo 'rootProject.name = "V2rayAdGuard"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi
          
          echo "=== ПРОВЕРКА ==="
          echo "app/build.gradle.kts размер: $(wc -l < app/build.gradle.kts) строк"
          echo "Корневой build.gradle.kts:"
          cat build.gradle.kts
      
      # 2. Установка окружения
      - name: ⚙️ Установка JDK и Android
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk
          
          # Простой Android SDK
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          
          # Лицензии и установка
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      # 3. Сборка
      - name: 🏗️ Тестовая сборка
        run: |
          # Gradle wrapper
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 7.5
            chmod +x gradlew
          else
            chmod +x gradlew
          fi
          
          echo "=== ТЕСТОВАЯ СБОРКА ==="
          echo "1. Проверка проектов..."
          ./gradlew projects --no-daemon 2>&1 | grep -A5 "Root project"
          
          echo ""
          echo "2. Запуск сборки..."
          if ./gradlew :app:assembleDebug --stacktrace; then
            echo "✅ СБОРКА УСПЕШНА!"
            
            echo ""
            echo "3. Поиск APK..."
            APK_FILES=$(find . -name "*.apk" -type f 2>/dev/null)
            if [ -n "$APK_FILES" ]; then
              echo "Найдены APK:"
              echo "$APK_FILES"
            else
              echo "APK не найдены. Проверяем что собралось..."
              find app/build/ -type f -name "*.apk" -o -name "*.aar" 2>/dev/null | head -10 || echo "Ничего не найдено"
            fi
          else
            echo "❌ ОШИБКА СБОРКИ"
            exit 1
          fi
      
      # 4. Загрузка результатов
      - name: 📦 Загрузка артефактов
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            app/build/outputs/
            **/*.apk
          if-no-files-found: warn
