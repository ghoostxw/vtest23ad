name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Проверяем структуру
        run: |
          echo "=== Что есть в проекте ==="
          ls -la
          echo ""
          echo "Файлы Gradle:"
          find . -name "*.gradle*" -o -name "*.kts" | head -10
      
      - name: Создаем gradlew если нет
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew не найден, создаем..."
            
            # Создаем минимальные файлы если их нет
            if [ ! -f "settings.gradle.kts" ]; then
              echo "Создаем settings.gradle.kts..."
              echo 'include(":app")' > settings.gradle.kts
            fi
            
            if [ ! -f "app/build.gradle.kts" ] && [ -f "build.gradle.kts" ]; then
              echo "Копируем build.gradle.kts в app/"
              mkdir -p app
              cp build.gradle.kts app/build.gradle.kts
            fi
            
            # Создаем gradle wrapper
            gradle wrapper --gradle-version 7.5 --distribution-type bin
            chmod +x gradlew
            echo "✅ gradlew создан"
          else
            chmod +x gradlew
            echo "✅ gradlew уже есть"
          fi
      
      - name: Собираем APK
        run: |
          echo "=== Сборка ==="
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -50
