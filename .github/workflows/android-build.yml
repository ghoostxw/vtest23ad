name: Сборка Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      # 2. Установка JDK 21 (обязательно до Android SDK)
      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Установка Android SDK (ИСПРАВЛЕННЫЙ формат!)
      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            "platform-tools"
            "platforms;android-34"
            "build-tools;34.0.0"
            "cmdline-tools;latest"
          accept-android-sdk-licenses: true

      # 4. Проверка установки Android SDK
      - name: Проверка Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms/ || echo "Платформы не найдены"
          ls -la $ANDROID_HOME/build-tools/ || echo "Build tools не найдены"

      # 5. Настройка переменных окружения для Android
      - name: Настройка окружения Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

      # 6. Проверка и создание gradlew
      - name: Подготовка Gradle
        run: |
          # Проверяем есть ли gradlew
          if [ -f "./gradlew" ]; then
            echo "gradlew найден"
            chmod +x ./gradlew
          else
            echo "gradlew не найден, создаём..."
            # Проверяем есть ли файлы Gradle
            if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
              gradle wrapper --gradle-version 8.5 --distribution-type bin
            else
              echo "ВНИМАНИЕ: Не найдены Gradle конфигурационные файлы"
              echo "Создаём минимальную структуру..."
              cat > settings.gradle.kts << 'EOF'
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "V2rayAdGuard"
              include(":app")
              EOF
              gradle wrapper --gradle-version 8.5
            fi
            chmod +x ./gradlew
          fi
          
          # Проверяем версию Gradle
          ./gradlew --version || echo "Gradle не запускается"

      # 7. Сборка APK (с диагностикой)
      - name: Сборка APK
        timeout-minutes: 15
        run: |
          echo "=== Информация о проекте ==="
          ./gradlew projects --no-daemon 2>&1 | tail -50 || true
          
          echo "=== Запуск сборки ==="
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --no-build-cache \
            --rerun-tasks 2>&1 | tee build.log
          
          # Проверяем результат
          if [ $? -eq 0 ]; then
            echo "✅ Сборка успешна!"
            echo "Найденные APK файлы:"
            find . -name "*.apk" -type f 2>/dev/null || echo "APK не найдены"
          else
            echo "❌ Сборка завершилась с ошибкой"
            echo "Последние 50 строк лога:"
            tail -50 build.log
            exit 1
          fi

      # 8. Загрузка APK
      - name: Загрузка APK артефактов
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: |
            **/app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 9. Сохранение логов при ошибке
      - name: Сохранение логов сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
