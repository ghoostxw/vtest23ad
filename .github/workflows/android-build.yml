name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      GRADLE_USER_HOME: /tmp/gradle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk-headless \
            unzip \
            wget \
            git \
            ca-certificates \
            gradle

      - name: Install Android SDK
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"

          mkdir -p "$SDK/cmdline-tools"
          cd "$HOME"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"

          if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Locate Android project
        run: |
          set -e
          echo "Searching settings.gradle..."
          SETTINGS_DIR=$(dirname "$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "Found in: $SETTINGS_DIR"
          echo "ANDROID_PROJECT_DIR=$SETTINGS_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          set -e
          cd "$ANDROID_PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
