name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        # Мы добавляем инициализацию репозиториев Google и MavenCentral прямо в команду,
        # чтобы Gradle знал, где искать плагин 'com.android.application'
        run: |
          gradle assembleDebug \
            -Pandroid.useAndroidX=true \
            --init-script <(echo "
              settingsEvaluated {
                pluginManagement {
                  repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                  }
                }
                dependencyResolutionManagement {
                  repositories {
                    google()
                    mavenCentral()
                  }
                }
              }
            ")

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
