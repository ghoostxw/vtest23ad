name: Android Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🛠️ СОЗДАЕМ ПРАВИЛЬНЫЙ APP/GRADLE
        run: |
          echo "=== СОЗДАЕМ app/build.gradle.kts ==="
          
          # Создаем папку app если нет
          mkdir -p app
          
          # Создаем правильный app/build.gradle.kts
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.example.v2rayadguard"
              compileSdk = 34
              
              defaultConfig {
                  applicationId = "com.example.v2rayadguard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              
              buildTypes {
                  getByName("debug") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.10.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
          }
          EOF
          
          echo "✅ app/build.gradle.kts создан"
          echo ""
          echo "Первые 10 строк файла:"
          head -10 app/build.gradle.kts
      
      - name: ⚙️ НАСТРОЙКА КОРНЕВЫХ ФАЙЛОВ
        run: |
          echo "=== НАСТРАИВАЕМ КОРНЕВЫЕ ФАЙЛЫ ==="
          
          # Корневой build.gradle.kts - ТОЛЬКО плагины
          echo 'plugins {' > build.gradle.kts
          echo '    id("com.android.application") version "8.5.0" apply false' >> build.gradle.kts
          echo '    id("org.jetbrains.kotlin.android") version "1.9.20" apply false' >> build.gradle.kts
          echo '}' >> build.gradle.kts
          
          # settings.gradle.kts - ВСЕ репозитории здесь
          echo 'pluginManagement {' > settings.gradle.kts
          echo '    repositories {' >> settings.gradle.kts
          echo '        google()' >> settings.gradle.kts
          echo '        mavenCentral()' >> settings.gradle.kts
          echo '        gradlePluginPortal()' >> settings.gradle.kts
          echo '    }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo '' >> settings.gradle.kts
          echo 'dependencyResolutionManagement {' >> settings.gradle.kts
          echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle.kts
          echo '    repositories {' >> settings.gradle.kts
          echo '        google()' >> settings.gradle.kts
          echo '        mavenCentral()' >> settings.gradle.kts
          echo '    }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo '' >> settings.gradle.kts
          echo 'rootProject.name = "V2rayAdGuard"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
          
          echo "✅ Корневые файлы настроены"
      
      - name: 📦 СОЗДАЕМ GRADLE WRAPPER
        run: |
          echo "=== СОЗДАЕМ GRADLE WRAPPER ==="
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew
          echo "✅ gradlew создан"
      
      - name: ☕ УСТАНОВКА JAVA
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk
          echo "✅ Java установлена"
      
      - name: 🏗️ СБОРКА APK
        run: |
          echo "=== ЗАПУСК СБОРКИ ==="
          
          echo "1. Проверка проектов:"
          ./gradlew projects --no-daemon 2>&1 | tail -10
          
          echo ""
          echo "2. Сборка debug APK:"
          if ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee /tmp/build.log; then
            echo "✅ ✅ ✅ СБОРКА УСПЕШНА!"
          else
            echo "❌ ОШИБКА СБОРКИ"
            tail -20 /tmp/build.log
            exit 1
          fi
      
      - name: 🔍 ПОИСК СОБРАННЫХ APK
        run: |
          echo "=== ПОИСК СОБРАННЫХ ФАЙЛОВ ==="
          
          echo "1. Все APK файлы:"
          find . -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "📦 $f ($(ls -lh "$f" | awk '{print $5}'))"
          done || echo "APK не найдены"
          
          echo ""
          echo "2. Директория app/build/outputs/apk/debug/:"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Директория не существует"
          
          echo ""
          echo "3. Все файлы в app/build/outputs/:"
          find app/build/outputs/ -type f 2>/dev/null | head -10 || echo "Нет файлов"
      
      - name: 📤 ЗАГРУЗКА APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*debug*.apk
          if-no-files-found: error
