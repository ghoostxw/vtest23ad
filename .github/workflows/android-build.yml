name: Android CI - HARD DEBUG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk-headless \
            unzip \
            wget \
            git \
            ca-certificates \
            gradle

      - name: HARD FILE SYSTEM DUMP
        run: |
          set -e
          echo "===== PWD ====="
          pwd

          echo "===== ROOT LS ====="
          ls -la

          echo "===== FIND ALL settings
