name: Android Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Исправляем структуру
        run: |
          echo "=== ИСПРАВЛЯЕМ ==="
          
          # 1. Удаляем Android плагин из корневого файла
          if grep -q "com.android.application" build.gradle.kts; then
            echo "Убираю плагин из корневого файла..."
            # Просто оставляем файл пустым
            echo '// Root build file - empty' > build.gradle.kts
          fi
          
          # 2. Создаем правильный settings.gradle.kts
          echo 'pluginManagement {' > settings.gradle.kts
          echo '    repositories { google(); mavenCentral(); gradlePluginPortal() }' >> settings.gradle.kts
          echo '}' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
          
          echo "✅ Структура исправлена"
      
      - name: Создаем gradlew
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
      
      - name: Собираем
        run: |
          sudo apt install -y openjdk-17-jdk
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -30
