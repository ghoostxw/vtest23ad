name: Android CI - Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      GRADLE_USER_HOME: /tmp/gradle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          set -e
          apt-get update
          apt-get install -y \
            openjdk-21-jdk-headless \
            unzip \
            wget \
            git \
            ca-certificates \
            gradle

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          yes | sdkmanager --licenses

      - name: Show Gradle configuration
        run: |
          echo "===== ROOT FILES ====="
          ls -la

          echo "===== settings.gradle(.kts) ====="
          if [ -f settings.gradle.kts ]; then cat settings.gradle.kts; fi
          if [ -f settings.gradle ]; then cat settings.gradle; fi

          echo "===== GRADLE PROJECTS ====="
          gradle projects

      - name: Build ALL debug APKs
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            **/build/outputs/apk/debug/*.apk
